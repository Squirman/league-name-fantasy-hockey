<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dues</title>
    <link rel="stylesheet" href="styles.css" />

    <link rel="stylesheet" href="general-styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="navbar"></div>
    <div class="page">
      <h1 class="bevan-regular">Dues</h1>
      <p class="table-caption-2">
        Current Yearly Buy-In: <span id="buy-in"></span>
      </p>
      <table class="styled-table normal-table" id="dues-table">
        <thead class="heading-table">
          <tr>
            <th>Name</th>
            <th>2026 / 2027 Owed</th>
            <th>2027 / 2028 Owed</th>
          </tr>
        </thead>
        <tbody id="dues-list"></tbody>
      </table>
      <p>
        Note: Next year's buy-in must be paid to trade draft picks in the
        current year (i.e. if your name is yellow, you cannot trade draft picks)
      </p>
    </div>
  </body>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="./index.js" charset="utf-8"></script>
  <script src="./dues.js" charset="utf-8"></script>
</html>
